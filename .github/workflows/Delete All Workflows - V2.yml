
name: Delete All Workflows - V2

on:
  workflow_dispatch:

permissions:
  actions: write
  

jobs:
  delete-all-workflow-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "Repository: $REPO"

          page=1
          total=0

          while true; do
            echo "Fetching workflow runs, page: $page"

            runs=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs?per_page=100&page=$page" \
              --jq '.workflow_runs[].id')

            if [ -z "$runs" ]; then
              break
            fi

            while read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Deleting workflow run: $run_id"

                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/$REPO/actions/runs/$run_id"

                total=$((total + 1))
              fi
            done <<< "$runs"

            page=$((page + 1))
          done

          echo "Deleted workflow runs: $total"

