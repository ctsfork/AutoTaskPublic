# ✔ 删除所有 workflow
# ✔ 保留 5 个
# ✔ 清空 artifacts
# ✔ 支持定时 + 手动触发
#
# keep_minimum_runs:保留的最小run数量

name: Delete All Workflows

on:
  # schedule:
  #   - cron: '0 18 * * *'  # 每天 清理记录
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0

