



name: 指定站点有效性检测

on:
  push:
    branches: [master, main]

  #手动执行任务
  workflow_dispatch:

  schedule:
    #每天10:00执行一次
    - cron: '0 10 * * *'
    

# permissions: write-all
permissions:
  contents: write
  pull-requests: write

  
