name: Delete All Workflows - dmvict
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete ALL workflow runs
        uses: dmvict/clean-workflow-runs@v1
        with:
          token: ${{ github.token }}
          # repo: owner/repo    # 默认当前仓库
          # workflow_id: ""     # 默认所有 workflow
          # branch: ""          # 默认所有分支
          # 只删这些结论；不写=所有结论，但显式写更稳
          run_conclusions: |
            success
            failure
            cancelled
            skipped
            timed_out
            action_required
            stale
            neutral
            startup_failure
          save_period: '0'            # 保留多久；90=90 天，'06:00:00'=6 小时，'00:00:00'=不保留
          # 每个 workflow 至少保留几条；0=全删 
          # ⚠️ save_min_runs_number 只对「被 run_conclusions 选中的 runs」生效。
          # 所以要想“真的全清”，必须把常见 conclusion 都列出来。
          save_min_runs_number: 0     
          dry: false                  # true 只打印不删